<div class="container mt-4">
  <h2 class="mb-4">Job Applications</h2>

  <!-- Alerts container for success and error messages -->
  <div id="alerts-container"></div>

  <div class="card mb-4">
    <div class="card-body">
      <div class="row">
        <div class="col-md-6">
          <div class="input-group">
            <input
              type="text"
              id="application-search"
              class="form-control"
              placeholder="Search applicant name..."
            />
          </div>
        </div>
        <div class="col-md-3">
          <select id="status-filter" class="form-select">
            <option value="">All Statuses</option>
            <option value="PENDING">Pending</option>
            <option value="ACCEPTED">Accepted</option>
            <option value="REJECTED">Rejected</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <div id="applications-table-container">
    <div class="table-responsive">
      <table class="table table-striped table-hover">
        <thead>
          <tr>
            <th>Applicant</th>
            <th>Job Title</th>
            <th>Applied Date</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="applications-table-body">
          <!-- Applications will be loaded here -->
        </tbody>
      </table>
    </div>
  </div>

  <div
    id="no-applications-message"
    class="alert alert-info text-center"
    style="display: none"
  >
    No applications found matching your criteria.
  </div>

  <div id="loading-applications" class="text-center p-3">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>
</div>

<!-- Application Details Modal -->
<div class="modal fade" id="application-modal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Application Details</h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>
      <div class="modal-body">
        <div class="row mb-4">
          <div class="col-md-6">
            <h6>Applicant Information</h6>
            <div id="applicant-details"></div>
          </div>
          <div class="col-md-6">
            <h6>Job Details</h6>
            <div id="job-details"></div>
          </div>
        </div>

        <h6>Application Status</h6>
        <div class="mb-3">
          <select id="application-status" class="form-select">
            <option value="PENDING">Pending</option>
            <option value="ACCEPTED">Accepted</option>
            <option value="REJECTED">Rejected</option>
          </select>
        </div>

        <div
          id="status-error"
          class="alert alert-danger"
          style="display: none"
        ></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Close
        </button>
        <button type="button" class="btn btn-primary" id="save-status-btn">
          Update Status
        </button>
      </div>
    </div>
  </div>
</div>
