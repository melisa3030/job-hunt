<!-- views/employer/manageEmployerCompany.html -->
<div class="container mt-4">
  <h2 class="mb-4">Manage Company</h2>

  <!-- Alerts container for success and error messages -->
  <div id="alerts-container"></div>

  <div id="company-container">
    <!-- Company form or details will be shown here -->
  </div>

  <div id="loading-company" class="text-center p-3">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>
</div>

<!-- Edit Company Modal -->
<div
  class="modal fade"
  id="edit-company-modal"
  tabindex="-1"
  aria-labelledby="editCompanyModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="editCompanyModalLabel">Edit Company</h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>
      <div class="modal-body">
        <form id="edit-company-form">
          <div
            class="alert alert-danger"
            id="edit-form-error"
            style="display: none"
          ></div>

          <div class="mb-3">
            <label for="edit-company-name" class="form-label"
              >Company Name*</label
            >
            <input
              type="text"
              class="form-control"
              id="edit-company-name"
              required
            />
          </div>

          <div class="row mb-3">
            <div class="col-md-6">
              <label for="edit-company-country" class="form-label"
                >Country*</label
              >
              <input
                type="text"
                class="form-control"
                id="edit-company-country"
                required
              />
            </div>
            <div class="col-md-6">
              <label for="edit-company-city" class="form-label">City*</label>
              <input
                type="text"
                class="form-control"
                id="edit-company-city"
                required
              />
            </div>
          </div>

          <div class="mb-3">
            <label for="edit-company-description" class="form-label"
              >Description*</label
            >
            <textarea
              class="form-control"
              id="edit-company-description"
              rows="4"
              required
            ></textarea>
          </div>

          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary close-modal"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button type="submit" class="btn btn-primary">Save Changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Delete confirmation modal -->

<div
  class="modal fade"
  id="delete-company-modal"
  tabindex="-1"
  aria-hidden="true"
>
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Delete Company</h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
        ></button>
      </div>
      <div class="modal-body">
        Are you sure you want to delete your company? This action cannot be
        undone.
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Cancel
        </button>
        <button
          id="confirm-delete-company-btn"
          type="button"
          class="btn btn-danger"
        >
          Delete
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Company Creation Form Template -->
<template id="company-form-template">
  <div class="card">
    <div class="card-body">
      <h5 class="card-title mb-4">Create Your Company</h5>
      <p class="text-muted mb-4">
        You haven't created a company yet. Please fill out the form below to
        create your company profile. You need a company profile to post jobs.
      </p>

      <form id="company-form">
        <div class="mb-3">
          <label for="company-name" class="form-label">Company Name*</label>
          <input type="text" class="form-control" id="company-name" required />
        </div>

        <div class="row mb-3">
          <div class="col-md-6">
            <label for="company-country" class="form-label">Country*</label>
            <input
              type="text"
              class="form-control"
              id="company-country"
              required
            />
          </div>
          <div class="col-md-6">
            <label for="company-city" class="form-label">City*</label>
            <input
              type="text"
              class="form-control"
              id="company-city"
              required
            />
          </div>
        </div>

        <div class="mb-3">
          <label for="company-description" class="form-label"
            >Description*</label
          >
          <textarea
            class="form-control"
            id="company-description"
            rows="4"
            required
          ></textarea>
        </div>

        <div class="text-end">
          <button type="submit" class="btn btn-primary">Create Company</button>
        </div>
      </form>
    </div>
  </div>
</template>

<!-- Company Details Template -->
<template id="company-details-template">
  <div class="card">
    <div class="card-body">
      <div class="d-flex justify-content-between align-items-start mb-4">
        <h5 class="card-title">Company Details</h5>
        <div>
          <button id="edit-company-btn" class="btn btn-outline-primary me-2">
            Edit
          </button>
          <button id="delete-company-btn" class="btn btn-outline-danger">
            Delete
          </button>
        </div>
      </div>

      <div class="row">
        <div class="col-md-8">
          <h6 class="fw-bold mb-2">Company Name</h6>
          <p id="display-company-name" class="mb-3"></p>

          <h6 class="fw-bold mb-2">Location</h6>
          <p class="mb-3">
            <span id="display-company-city"></span>,
            <span id="display-company-country"></span>
          </p>

          <h6 class="fw-bold mb-2">Description</h6>
          <p id="display-company-description" class="mb-0"></p>
        </div>
      </div>
    </div>
  </div>
</template>
