<div class="container-fluid mt-4">
  <!-- Alerts Container -->
  <div id="alerts-container"></div>

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h2">My Applications</h1>
  </div>

  <!-- Search and Filter Controls -->
  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-6">
          <div class="input-group">
            <input
              type="text"
              id="application-search"
              class="form-control"
              placeholder="Search by job title or company..."
            />
            <button class="btn btn-primary" type="button" id="search-btn">
              Search
            </button>
          </div>
        </div>
        <div class="col-md-3">
          <select id="status-filter" class="form-select">
            <option value="">All Statuses</option>
            <option value="PENDING">Pending</option>
            <option value="APPROVED">Approved</option>
            <option value="REJECTED">Rejected</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- Applications Table -->
  <div class="card shadow-sm">
    <div class="card-body">
      <!-- Loading Indicator -->
      <div
        id="loading-applications"
        class="text-center py-4"
        style="display: none"
      >
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <div class="mt-2">Loading applications...</div>
      </div>

      <div class="table-responsive">
        <table class="table table-hover">
          <thead>
            <tr>
              <th>#</th>
              <th>Job Title</th>
              <th>Company</th>
              <th>Applied Date</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="applications-table-body">
            <!-- Applications will be inserted here -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- View Application Modal -->
  <div
    class="modal fade"
    id="application-modal"
    tabindex="-1"
    aria-labelledby="application-modal-label"
    aria-hidden="true"
  >
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="application-modal-label">
            Application Details
          </h5>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Close"
          ></button>
        </div>
        <div class="modal-body">
          <div id="application-details">
            <!-- Application details will be loaded here -->
          </div>
        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary"
            data-bs-dismiss="modal"
          >
            Close
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
