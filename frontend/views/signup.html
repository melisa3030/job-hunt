<div class="container">
  <div class="row justify-content-center mt-5">
    <div class="col-md-6">
      <div class="card">
        <div class="card-body">
          <h2 class="card-title text-center mb-4">Create an Account</h2>

          <!-- Account type selection -->
          <div class="mb-3 text-center">
            <div class="btn-group w-100" role="group" aria-label="Account type">
              <button
                type="button"
                class="btn btn-outline-primary active"
                id="applicant-btn"
              >
                Applicant
              </button>
              <button
                type="button"
                class="btn btn-outline-primary"
                id="employer-btn"
              >
                Employer
              </button>
            </div>
          </div>

          <form id="signup-form">
            <div class="mb-3">
              <label for="name" class="form-label">Full Name</label>
              <input
                type="text"
                class="form-control"
                id="name"
                name="name"
                required
              />
            </div>

            <div class="mb-3">
              <label for="username" class="form-label">Username</label>
              <input
                type="text"
                class="form-control"
                id="username"
                name="username"
                required
              />
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input
                type="email"
                class="form-control"
                id="email"
                name="email"
                required
              />
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                required
              />
            </div>

            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-primary">Sign Up</button>
            </div>

            <div
              id="signup_error"
              class="alert text-center alert-danger mt-3"
              style="display: none"
            ></div>
          </form>

          <div class="text-center mt-3">
            <p class="mb-0">
              Already have an account?
              <a href="/login" data-link>Log In</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
