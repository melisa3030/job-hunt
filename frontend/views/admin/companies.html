<div class="container-fluid mt-4">
    <div class="row">
        <div class="col">
            <h1 class="h3">Manage Companies</h1>
            <p class="text-muted">View, add, edit, and delete companies</p>
        </div>
    </div>

    <!-- Alerts container -->
    <div id="alerts-container"></div>

    <!-- Loading spinner -->
    <div id="loading-spinner" class="d-none justify-content-center my-5">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <!-- Controls -->
    <div class="row mb-4">
        <div class="col-md-6">
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-search"></i></span>
                <input type="text" id="company-search" class="form-control" placeholder="Search companies...">
            </div>
        </div>
        <div class="col-md-6 text-md-end mt-3 mt-md-0">
            <button id="add-company-btn" class="btn btn-primary">
                <i class="bi bi-plus"></i> Add Company
            </button>
        </div>
    </div>

    <!-- Companies table -->
    <div class="card shadow-sm">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                    <tr>
                        <th class="col-1 fw-bold">#</th>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Country</th>
                        <th>City</th>
                        <th>Description</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody id="companies-table-body">
                    <!-- Companies will be inserted here -->
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <nav aria-label="Companies pagination">
                <ul id="companies-pagination" class="pagination justify-content-center">
                    <!-- Pagination will be inserted here -->
                </ul>
            </nav>
        </div>
    </div>


    <!-- Company Modal -->
    <div class="modal fade" id="company-modal" tabindex="-1" aria-labelledby="company-modal-title" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="company-modal-title">Add/Edit Company</h5>
                    <button type="button" class="btn-close close-modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="company-form">
                        <input type="hidden" id="company-id">

                        <div class="mb-3">
                            <label for="company-name" class="form-label">Company Name *</label>
                            <input type="text" class="form-control" id="company-name" required>
                        </div>

                        <div class="mb-3">
                            <label for="company-country" class="form-label">Country</label>
                            <input type="text" class="form-control" id="company-country">
                        </div>

                        <div class="mb-3">
                            <label for="company-city" class="form-label">City</label>
                            <input type="text" class="form-control" id="company-city">
                        </div>

                        <div class="mb-3">
                            <label for="company-description" class="form-label">Description</label>
                            <textarea class="form-control" id="company-description" rows="3"></textarea>
                        </div>

                        <div class="text-end">
                            <button type="button" class="btn btn-secondary close-modal">Cancel</button>
                            <button type="submit" class="btn btn-primary">Save Company</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="delete-company-modal" tabindex="-1" aria-labelledby="delete-company-modal-label"
         aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="delete-company-modal-label">Confirm Delete</h5>
                    <button type="button" class="btn-close close-modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>Are you sure you want to delete this company? This action cannot be undone.</p>
                    <input type="hidden" id="company-id-to-delete">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary close-modal">Cancel</button>
                    <button type="button" class="btn btn-danger" id="confirm-delete-btn">Delete Company</button>
                </div>
            </div>
        </div>
    </div>
</div>
