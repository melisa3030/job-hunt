<div class="container-fluid mt-4">
  <div class="row">
    <div class="col">
      <h1 class="h3">Manage Users</h1>
      <p class="text-muted">View, add, edit, and delete users</p>
    </div>
  </div>

  <!-- Alerts container -->
  <div id="alerts-container"></div>

  <!-- Controls -->
  <div class="row mb-4">
    <div class="col-md-8">
      <div class="input-group">
        <span class="input-group-text"><i class="fas fa-search"></i></span>
        <input
          type="text"
          id="searchInput"
          class="form-control"
          placeholder="Search by name or user ID..."
        />
        <div class="input-group-append">
          <button class="btn btn-primary" id="searchBtn" type="button">
            Search
          </button>
        </div>
      </div>
    </div>
    <div class="col-md-2">
      <select class="form-select" id="searchType">
        <option value="name">Search by Name</option>
        <option value="id">Search by User ID</option>
      </select>
    </div>
    <div class="col-md-2 text-md-end mt-3 mt-md-0">
      <button id="createUserBtn" class="btn btn-primary">
        <i class="fas fa-plus"></i> Add User
      </button>
    </div>
  </div>

  <!-- Users table -->
  <div class="card shadow-sm">
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-hover">
          <tr>
            <th class="col-1">#</th>
            <th>ID</th>
            <th>Name</th>
            <th>Username</th>
            <th>Email</th>
            <th>Role</th>
            <th>Actions</th>
          </tr>
          <tbody id="usersList">
            <!-- Users will be loaded here dynamically -->
          </tbody>
        </table>
      </div>

      <div class="text-center p-3" id="loadingMessage">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-2">Loading users...</p>
      </div>
      <div class="text-center p-3 d-none" id="noUsersMessage">
        <p>No users found</p>
      </div>

      <!-- Pagination -->
      <nav class="mt-3">
        <ul class="pagination justify-content-center" id="pagination">
          <!-- Pagination will be added dynamically -->
        </ul>
      </nav>
    </div>
  </div>

  <!-- Create user modal -->
  <div
    class="modal fade"
    id="createUserModal"
    tabindex="-1"
    aria-labelledby="createUserModalLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="createUserModalLabel">Create New User</h5>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Close"
          ></button>
        </div>
        <div class="modal-body">
          <form id="createUserForm">
            <div class="mb-3">
              <label for="createName" class="form-label">Name</label>
              <input
                type="text"
                class="form-control"
                id="createName"
                required
              />
            </div>
            <div class="mb-3">
              <label for="createUsername" class="form-label">Username</label>
              <input
                type="text"
                class="form-control"
                id="createUsername"
                required
              />
              <div class="form-text">
                <small>Username must be unique.</small>
              </div>
            </div>
            <div class="mb-3">
              <label for="createEmail" class="form-label">Email</label>
              <input
                type="email"
                class="form-control"
                id="createEmail"
                required
              />
            </div>
            <div class="mb-3">
              <label for="createPassword" class="form-label">Password</label>
              <input
                type="password"
                class="form-control"
                id="createPassword"
                required
              />
            </div>
            <div class="mb-3">
              <label for="createRole" class="form-label">Role</label>
              <select class="form-select" id="createRole" required>
                <option value="APPLICANT">Applicant</option>
                <option value="EMPLOYER">Employer</option>
                <option value="ADMIN">Admin</option>
              </select>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary"
            data-bs-dismiss="modal"
          >
            Cancel
          </button>
          <button type="button" class="btn btn-success" id="saveNewUser">
            Create User
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Edit User Modal -->
  <div
    class="modal fade"
    id="editUserModal"
    tabindex="-1"
    aria-labelledby="editUserModalLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="editUserModalLabel">Edit User</h5>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Close"
          ></button>
        </div>
        <div class="modal-body">
          <form id="editUserForm">
            <input type="hidden" id="editUserId" />
            <div class="mb-3">
              <label for="editName" class="form-label">Name</label>
              <input type="text" class="form-control" id="editName" required />
            </div>
            <div class="mb-3">
              <label for="editEmail" class="form-label">Email</label>
              <input
                type="email"
                class="form-control"
                id="editEmail"
                required
              />
            </div>
            <div class="mb-3">
              <label for="editPassword" class="form-label">Password</label>
              <input
                type="password"
                class="form-control"
                id="editPassword"
                placeholder="Leave blank to keep current password"
              />
            </div>
            <div class="mb-3">
              <label for="editRole" class="form-label">Role</label>
              <select class="form-select" id="editRole">
                <option value="">-- No change --</option>
                <option value="APPLICANT">Applicant</option>
                <option value="EMPLOYER">Employer</option>
                <option value="ADMIN">Admin</option>
              </select>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary"
            data-bs-dismiss="modal"
          >
            Cancel
          </button>
          <button type="button" class="btn btn-primary" id="saveUserChanges">
            Save Changes
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div
    class="modal fade"
    id="deleteUserModal"
    tabindex="-1"
    aria-labelledby="deleteUserModalLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="deleteUserModalLabel">Confirm Delete</h5>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Close"
          ></button>
        </div>
        <div class="modal-body">
          <p>
            Are you sure you want to delete this user? This action cannot be
            undone.
          </p>
          <p><strong>User: </strong><span id="deleteUserName"></span></p>
        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary"
            data-bs-dismiss="modal"
          >
            Cancel
          </button>
          <button type="button" class="btn btn-danger" id="confirmDeleteUser">
            Delete
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
