<div class="container-fluid mt-4">
  <div id="alerts-container"></div>

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Manage Tags</h2>
    <button id="add-tag-btn" class="btn btn-primary">Add Tag</button>
  </div>

  <div class="card">
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-hover">
          <thead>
            <tr>
              <th>Name</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody id="tags-table-body">
            <!-- Tags will be dynamically inserted here -->
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Modal for Add/Edit Tag -->
<div
  class="modal fade"
  id="tag-modal"
  tabindex="-1"
  aria-labelledby="tag-modal-label"
  aria-hidden="true"
>
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="tag-modal-label">Add Tag</h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>
      <div class="modal-body">
        <form id="tag-form">
          <input type="hidden" id="tag-id" />
          <div class="mb-3">
            <label for="tag-name" class="form-label">Tag Name</label>
            <input
              type="text"
              class="form-control"
              id="tag-name"
              required
              placeholder="Enter tag name"
            />
            <div class="invalid-feedback">Please provide a tag name.</div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Close
        </button>
        <button
          type="submit"
          id="save-tag-btn"
          form="tag-form"
          class="btn btn-primary"
        >
          Save Tag
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Modal for Delete Confirmation -->
<div
  class="modal fade"
  id="delete-confirm-modal"
  tabindex="-1"
  aria-labelledby="delete-confirm-modal-label"
  aria-hidden="true"
>
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="delete-confirm-modal-label">Delete Tag</h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>
      <div class="modal-body">
        <p>
          Are you sure you want to delete the tag "<span
            id="delete-tag-name"
          ></span
          >"?
        </p>
        <p class="text-danger">This action cannot be undone.</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Cancel
        </button>
        <button type="button" id="confirm-delete-btn" class="btn btn-danger">
          Delete
        </button>
      </div>
    </div>
  </div>
</div>
