<div class="container-fluid mt-4">
  <div class="row">
    <div class="col">
      <h1 class="h3">Manage Jobs</h1>
      <p class="text-muted">View, edit, and delete job listings</p>
    </div>
  </div>

  <!-- Alerts container -->
  <div id="alerts-container"></div>

  <!-- Loading spinner -->
  <div id="loading-spinner" class="d-none justify-content-center my-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <!-- Controls -->
  <div class="row mb-4">
    <div class="col-md-12">
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-search"></i></span>
        <input
          type="text"
          id="job-search"
          class="form-control"
          placeholder="Search jobs..."
        />
      </div>
    </div>
  </div>

  <!-- Jobs table -->
  <div class="card shadow-sm">
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-hover">
          <thead>
            <tr>
              <th>#</th>
              <th>ID</th>
              <th>Company</th>
              <th>Title</th>
              <th>Category</th>
              <th>Location</th>
              <th>Work Type</th>
              <th>Experience</th>
              <th>Salary</th>
              <th>Description</th>
              <th>Expires</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="jobs-table-body">
            <!-- Jobs will be inserted here -->
          </tbody>
        </table>
      </div>

      <!-- Pagination -->
      <nav aria-label="Jobs pagination">
        <ul id="jobs-pagination" class="pagination justify-content-center">
          <!-- Pagination will be inserted here -->
        </ul>
      </nav>
    </div>
  </div>

  <!-- Job Edit Modal -->
  <div
    class="modal fade"
    id="job-modal"
    tabindex="-1"
    aria-labelledby="job-modal-title"
    aria-hidden="true"
  >
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="job-modal-title">Edit Job</h5>
          <button
            type="button"
            class="btn-close close-modal"
            aria-label="Close"
          ></button>
        </div>
        <div class="modal-body">
          <form id="job-form">
            <input type="hidden" id="job-id" />

            <div class="row mb-3">
              <div class="col-md-6">
                <label for="job-company" class="form-label">Company *</label>
                <select class="form-select" id="job-company" required>
                  <option value="">Select a company</option>
                  <!-- Companies will be loaded dynamically -->
                </select>
              </div>
              <div class="col-md-6">
                <label for="job-title" class="form-label">Job Title *</label>
                <select class="form-select" id="job-title" required>
                  <option value="">Select a job title</option>
                  <!-- Job titles will be loaded dynamically -->
                </select>
              </div>
            </div>

            <div class="row mb-3">
              <div class="col-md-6">
                <label for="job-category" class="form-label">Category *</label>
                <select class="form-select" id="job-category" required>
                  <option value="">Select a category</option>
                  <!-- Categories will be loaded dynamically -->
                </select>
              </div>
              <div class="col-md-6">
                <label for="job-salary" class="form-label">Salary *</label>
                <input
                  type="number"
                  class="form-control"
                  id="job-salary"
                  placeholder="e.g., 50000"
                  required
                />
              </div>
            </div>

            <div class="row mb-3">
              <div class="col-md-6">
                <label for="job-city" class="form-label">City *</label>
                <input
                  type="text"
                  class="form-control"
                  id="job-city"
                  placeholder="e.g., New York"
                  required
                />
              </div>
              <div class="col-md-6">
                <label for="job-country" class="form-label">Country *</label>
                <input
                  type="text"
                  class="form-control"
                  id="job-country"
                  placeholder="e.g., USA"
                  required
                />
              </div>
            </div>

            <div class="row mb-3">
              <div class="col-md-6">
                <label for="job-work-type" class="form-label"
                  >Work Type *</label
                >
                <select class="form-select" id="job-work-type" required>
                  <option value="REMOTE">Remote</option>
                  <option value="HYBRID">Hybrid</option>
                  <option value="ON-SITE">On-site</option>
                </select>
              </div>
              <div class="col-md-6">
                <label for="job-experience-level" class="form-label"
                  >Experience Level *</label
                >
                <select class="form-select" id="job-experience-level" required>
                  <option value="JUNIOR">Junior</option>
                  <option value="INTERMEDIATE">Intermediate</option>
                  <option value="SENIOR">Senior</option>
                </select>
              </div>
            </div>

            <div class="mb-3">
              <label for="job-description" class="form-label"
                >Description *</label
              >
              <textarea
                class="form-control"
                id="job-description"
                rows="5"
                required
                placeholder="Detailed job description"
              ></textarea>
            </div>

            <div class="mb-3">
              <label for="job-expires-at" class="form-label"
                >Expires At *</label
              >
              <input
                type="date"
                class="form-control"
                id="job-expires-at"
                required
              />
            </div>

            <div class="text-end">
              <button type="button" class="btn btn-secondary close-modal">
                Cancel
              </button>
              <button type="submit" class="btn btn-primary">Update Job</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div
    class="modal fade"
    id="delete-job-modal"
    tabindex="-1"
    aria-labelledby="delete-job-modal-label"
    aria-hidden="true"
  >
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="delete-job-modal-label">
            Confirm Delete
          </h5>
          <button
            type="button"
            class="btn-close close-modal"
            aria-label="Close"
          ></button>
        </div>
        <div class="modal-body">
          <p>
            Are you sure you want to delete this job? This action cannot be
            undone.
          </p>
          <input type="hidden" id="job-id-to-delete" />
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary close-modal">
            Cancel
          </button>
          <button type="button" class="btn btn-danger" id="confirm-delete-btn">
            Delete Job
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
