<div class="container-fluid mt-4">
  <div id="alerts-container"></div>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Manage Categories</h2>
    <button
      id="add-category-btn"
      class="btn btn-primary"
      data-bs-toggle="modal"
      data-bs-target="#category-modal"
    >
      Add Category
    </button>
  </div>
  <div class="card">
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-hover">
          <thead>
            <tr>
              <th>Name</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody id="categories-table-body"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Modal for Add/Edit Category -->
<div
  class="modal fade"
  id="category-modal"
  tabindex="-1"
  aria-labelledby="category-modal-label"
  aria-hidden="true"
>
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="category-modal-label">Add Category</h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>
      <div class="modal-body">
        <form id="category-form">
          <input type="hidden" id="category-id" />
          <div class="mb-3">
            <label for="category-name" class="form-label">Category Name</label>
            <input
              type="text"
              class="form-control"
              id="category-name"
              required
              placeholder="Enter category name"
            />
            <div class="invalid-feedback">Please provide a category name.</div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Close
        </button>
        <button
          type="submit"
          id="save-category-btn"
          form="category-form"
          class="btn btn-primary"
        >
          Save Category
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Delete Confirmation Modal -->
<div
  class="modal fade"
  id="delete-category-modal"
  tabindex="-1"
  aria-labelledby="delete-category-modal-label"
  aria-hidden="true"
>
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="delete-category-modal-label">
          Delete Category
        </h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>
      <div class="modal-body">
        <p>Are you sure you want to delete this category?</p>
        <p class="text-danger">This action cannot be undone.</p>
        <input type="hidden" id="category-id-to-delete" />
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Cancel
        </button>
        <button type="button" id="confirm-delete-btn" class="btn btn-danger">
          Delete
        </button>
      </div>
    </div>
  </div>
</div>
