<div class="admin-users container mt-4">
    <h2 class="mb-4">Manage Users</h2>

    <!-- Search functionality -->
    <div class="row mb-4">
        <div class="col-md-8">
            <div class="input-group">
                <input type="text" id="searchInput" class="form-control" placeholder="Search by name or user ID...">
                <div class="input-group-append">
                    <button class="btn btn-primary" id="searchBtn" type="button">
                        <i class="fas fa-search"></i> Search
                    </button>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <select class="form-select" id="searchType">
                <option value="name">Search by Name</option>
                <option value="id">Search by User ID</option>
            </select>
        </div>
    </div>

    <!-- Users list -->
    <div class="card">
        <div class="card-header bg-light">
            <div class="row">
                <div class="col-1 fw-bold">#</div>
                <div class="col-2 fw-bold">ID</div>
                <div class="col-3 fw-bold">Name</div>
                <div class="col-3 fw-bold">Email</div>
                <div class="col-3 fw-bold">Actions</div>
            </div>
        </div>
        <div class="card-body p-0">
            <div id="usersList" class="list-group list-group-flush">
                <!-- Users will be loaded here dynamically -->
                <div class="text-center p-3" id="loadingMessage">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-2">Loading users...</p>
                </div>
                <div class="text-center p-3 d-none" id="noUsersMessage">
                    <p>No users found</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Pagination -->
    <nav class="mt-3">
        <ul class="pagination justify-content-center" id="pagination">
            <!-- Pagination will be added dynamically -->
        </ul>
    </nav>
</div>

<!-- Edit User Modal -->
<div class="modal fade" id="editUserModal" tabindex="-1" aria-labelledby="editUserModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="editUserModalLabel">Edit User</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="editUserForm">
                    <input type="hidden" id="editUserId">
                    <div class="mb-3">
                        <label for="editName" class="form-label">Name</label>
                        <input type="text" class="form-control" id="editName" required>
                    </div>
                    <div class="mb-3">
                        <label for="editEmail" class="form-label">Email</label>
                        <input type="email" class="form-control" id="editEmail" required>
                    </div>
                    <div class="mb-3">
                        <label for="editRole" class="form-label">Role</label>
                        <select class="form-select" id="editRole">
                            <option value="">-- No change --</option>
                            <option value="APPLICANT">Applicant</option>
                            <option value="EMPLOYER">Employer</option>
                            <option value="ADMIN">Admin</option>
                        </select>

                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="saveUserChanges">Save Changes</button>
            </div>
        </div>
    </div>
</div>

<!-- Delete Confirmation Modal -->
<div class="modal fade" id="deleteUserModal" tabindex="-1" aria-labelledby="deleteUserModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="deleteUserModalLabel">Confirm Delete</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to delete this user? This action cannot be undone.</p>
                <p><strong>User: </strong><span id="deleteUserName"></span></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-danger" id="confirmDeleteUser">Delete</button>
            </div>
        </div>
    </div>
</div>
