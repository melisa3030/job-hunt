<div class="container">
  <div class="row justify-content-center mt-5">
    <div class="col-md-6">
      <div class="card">
        <div class="card-body">
          <h2 class="card-title text-center mb-4">Login</h2>
          <form id="login-form">
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input
                type="email"
                class="form-control"
                id="email"
                name="email"
                required
              />
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                required
              />
            </div>

            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-primary">Login</button>
            </div>

            <div
              id="login_error"
              class="alert text-center alert-danger mt-3"
              style="display: none"
            ></div>
          </form>

          <div class="text-center mt-3">
            <p class="mb-0">
              Don't have an account?
              <a href="/signup" data-link>Sign Up</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
