components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for authentication

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        role:
          type: string
          enum: [EMPLOYER, APPLICANT, ADMIN]
        company_id:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time

    LimitedUserData:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        profile_picture:
          type: string

    UserCreateRequest:
      type: object
      required:
        - name
        - username
        - email
        - password
        - role
      properties:
        name:
          type: string
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        role:
          type: string
          enum: [EMPLOYER, APPLICANT, ADMIN]
        company_id:
          type: integer
          nullable: true

    UserUpdateRequest:
      type: object
      properties:
        name:
          type: string
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        role:
          type: string
          enum: [EMPLOYER, APPLICANT, ADMIN]
        company_id:
          type: integer
          nullable: true

    Company:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        country:
          type: string
        city:
          type: string
        description:
          type: string
        employer_id:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time

    CompanyCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        country:
          type: string
        city:
          type: string
        description:
          type: string
        employer_id:
          type: integer
          nullable: true

    CompanyUpdateRequest:
      type: object
      properties:
        name:
          type: string
        country:
          type: string
        city:
          type: string
        description:
          type: string
        employer_id:
          type: integer
          nullable: true

    JobCategory:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string

    JobCategoryCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string

    JobCategoryUpdateRequest:
      type: object
      properties:
        name:
          type: string

    JobTitle:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string

    JobTitleCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string

    JobTitleUpdateRequest:
      type: object
      properties:
        name:
          type: string

    Job:
      type: object
      properties:
        id:
          type: integer
        job_title_id:
          type: integer
        company_id:
          type: integer
        category_id:
          type: integer
        description:
          type: string
        city:
          type: string
        country:
          type: string
        work_type:
          type: string
          enum: [REMOTE, HYBRID, ON-SITE]
        experience_level:
          type: string
          enum: [JUNIOR, INTERMEDIATE, SENIOR]
        salary:
          type: number
          format: float
        posted_by:
          type: integer
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    JobCreateRequest:
      type: object
      required:
        - job_title_id
        - company_id
        - category_id
        - description
        - city
        - country
        - work_type
        - experience_level
        - posted_by
        - expires_at
      properties:
        job_title_id:
          type: integer
        company_id:
          type: integer
        category_id:
          type: integer
        description:
          type: string
        city:
          type: string
        country:
          type: string
        work_type:
          type: string
          enum: [REMOTE, HYBRID, ON-SITE]
        experience_level:
          type: string
          enum: [JUNIOR, INTERMEDIATE, SENIOR]
        salary:
          type: number
          format: float
        posted_by:
          type: integer
        expires_at:
          type: string
          format: date-time

    JobUpdateRequest:
      type: object
      properties:
        job_title_id:
          type: integer
        company_id:
          type: integer
        category_id:
          type: integer
        description:
          type: string
        city:
          type: string
        country:
          type: string
        work_type:
          type: string
          enum: [REMOTE, HYBRID, ON-SITE]
        experience_level:
          type: string
          enum: [JUNIOR, INTERMEDIATE, SENIOR]
        salary:
          type: number
          format: float
        posted_by:
          type: integer
        expires_at:
          type: string
          format: date-time

    Application:
      type: object
      properties:
        id:
          type: integer
        job_id:
          type: integer
        applicant_id:
          type: integer
        status:
          type: string
          enum: [PENDING, ACCEPTED, REJECTED]
        applied_at:
          type: string
          format: date-time

    ApplicationCreateRequest:
      type: object
      required:
        - job_id
        - applicant_id
      properties:
        job_id:
          type: integer
        applicant_id:
          type: integer
        status:
          type: string
          enum: [PENDING, ACCEPTED, REJECTED]

    ApplicationUpdateRequest:
      type: object
      properties:
        status:
          type: string
          enum: [PENDING, ACCEPTED, REJECTED]

    BookmarkedJob:
      type: object
      properties:
        user_id:
          type: integer
        job_id:
          type: integer
        created_at:
          type: string
          format: date-time

    BookmarkCreateRequest:
      type: object
      required:
        - user_id
        - job_id
      properties:
        user_id:
          type: integer
        job_id:
          type: integer

    Review:
      type: object
      properties:
        id:
          type: integer
        company_id:
          type: integer
        job_title_id:
          type: integer
        rating:
          type: integer
        positive_review:
          type: string
        negative_review:
          type: string
        currently_working:
          type: string
          enum: [YES, NO]
        recommend:
          type: string
          enum: [YES, NO]
        employment_type:
          type: string
          enum: [FULL_TIME, PART_TIME, CONTRACT, INTERNSHIP]
        employment_duration:
          type: string
          enum: [LESS_THAN_A_YEAR, ONE_TO_TWO_YEARS, THREE_TO_FIVE_YEARS, MORE_THAN_FIVE_YEARS]
        created_at:
          type: string
          format: date-time
        anonymous:
          type: boolean
        user_id:
          type: integer

    ReviewCreateRequest:
      type: object
      required:
        - company_id
        - job_title_id
        - rating
        - user_id
      properties:
        company_id:
          type: integer
        job_title_id:
          type: integer
        rating:
          type: integer
        positive_review:
          type: string
        negative_review:
          type: string
        currently_working:
          type: string
          enum: [YES, NO]
        recommend:
          type: string
          enum: [YES, NO]
        employment_type:
          type: string
          enum: [FULL_TIME, PART_TIME, CONTRACT, INTERNSHIP]
        employment_duration:
          type: string
          enum: [LESS_THAN_A_YEAR, ONE_TO_TWO_YEARS, THREE_TO_FIVE_YEARS, MORE_THAN_FIVE_YEARS]
        anonymous:
          type: boolean
        user_id:
          type: integer

    ReviewTag:
      type: object
      properties:
        review_id:
          type: integer
        tag_id:
          type: integer

    JobPerk:
      type: object
      properties:
        job_id:
          type: integer
        perk_id:
          type: integer

    JobTag:
      type: object
      properties:
        job_id:
          type: integer
        tag_id:
          type: integer

    Perk:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PerkCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string

    Tag:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        color:
          type: string
        created_at:
          type: string
          format: date-time

    TagCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          description: Hex color code

    TagUpdateRequest:
      type: object
      properties:
        name:
          type: string
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'

    Error:
      type: object
      properties:
        message:
          type: string
          description: Error message
        code:
          type: integer
          description: Error code

  responses:
    UnauthorizedError:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: "Authentication required"
            code: 401

    ForbiddenError:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: "Insufficient permissions"
            code: 403

    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: "Resource not found"
            code: 404

    BadRequestError:
      description: Invalid request data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: "Invalid request data"
            code: 400

security:
  - bearerAuth: []
